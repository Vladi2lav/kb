<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kanban</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Kanban</h1>
    <div class="team">
      <div id="people"></div>
      <form id="add-person">
        <input name="name" placeholder="+ Участник" autocomplete="off" maxlength="40" />
      </form>
    </div>
    <button id="reset" title="Очистить доску">Очистить</button>
  </header>

  <div id="picker" class="picker" hidden></div>

  <main id="board"></main>

  <template id="column-tpl">
    <section class="column">
      <h2><span class="title"></span> <span class="count"></span></h2>
      <ul class="cards"></ul>
      <form class="add">
        <input name="text" placeholder="+ Новая задача" autocomplete="off" />
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
